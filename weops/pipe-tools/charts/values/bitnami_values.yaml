initdbScripts:
  user.sql: |
    CREATE USER 'weops'@'%' IDENTIFIED BY 'Weops!';
    GRANT PROCESS, SELECT, REPLICATION CLIENT ON *.* TO 'weops'@'%';

auth:
  rootPassword: Weops!

primary:
  nodeSelector:
    node-role: worker
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 300m
      memory: 800Mi
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  startupProbe:
    enabled: false

secondary:
  nodeSelector:
    node-role: worker
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 300m
      memory: 800Mi
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  startupProbe:
    enabled: false
